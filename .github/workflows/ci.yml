name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  version:
    name: Version and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make version-check
      - name: Select release from push
        id: release
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tag=$(python3 scripts/release.py plan "$BEFORE")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  collector-linux:
    name: Collector tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-collector-linux

  macos:
    name: Checks and build (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: make deps
      - run: make check
      - run: make build
      - run: git diff --exit-code

  release:
    name: Publish source release
    if: github.event_name == 'push' && github.repository == 'cyberbot-ai/cyberbot' && needs.version.outputs.tag != ''
    needs: [version, collector-linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release.py publish "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
